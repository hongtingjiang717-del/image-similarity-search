<!-- 声明这是 HTML5 页面，让浏览器按现代 HTML 规则解析。 -->
<!DOCTYPE html>
<!-- 页面根元素；lang="zh-CN" 说明主要语言是简体中文。 -->
<html lang="zh-CN">
<!-- head 保存网页元信息和样式引用，通常不直接显示为正文。 -->
<head>
    <!-- 使用 UTF-8 解码页面，避免中文变成乱码。 -->
    <meta charset="UTF-8">
    <!-- 让移动浏览器按设备宽度布局；initial-scale=1.0 表示初始缩放比例为 1。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页上的标题，不是页面正文中的大标题。 -->
    <title>智图寻宝</title>
    <!-- 引入 CSS 文件；其中的 url_for 调用是 Jinja 模板表达式，由 Python 在发送页面前生成正确静态地址。 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- body 里面是用户能看到并操作的页面内容。 -->
<body>
<!-- div 是容器标签；class="container" 让 CSS 的 .container 规则控制整体布局。 -->
<div class="container">

    <!-- 把项目名、分隔线和标题放进同一个 Flex 容器，便于横向对齐。 -->
    <div class="title-container">
        <!-- 语义上强调项目名称；不依赖缺失的品牌图片也能显示文字标题。 -->
        <strong>智图寻宝</strong>
        <!-- 空容器通过 CSS 的宽度、高度和背景色画出分隔线。 -->
        <div class="title-divider"></div>
        <!-- 页面主标题；h1/h3 表示标题层级，不只是字号大小。 -->
        <h1>智能商品识别系统</h1>
    </div>
    <!-- 文件选择框；id 供 JS 精确查找，accept 是浏览器的选图提示，后端仍需验证真实图片。 -->
    <input type="file" id="image-upload" accept="image/*">
<!-- label 包含复选框和说明；checked 表示默认勾选，JS 读取 checked 决定是否演示加噪。 -->
<label><input type="checkbox" id="add-noise" checked> 演示加噪后去噪</label>
<!-- 预留状态提示；role 和 aria-live 帮助屏幕阅读器感知状态变化。 -->
<p id="status" role="status" aria-live="polite"></p>
    <!-- 把四个操作按钮分为一组；CSS 负责布局，JS 根据每个按钮 id 登记点击动作。 -->
    <div class="button-group">
        <!-- 本地选择/预览图片按钮；实际上传模型接口的请求由各业务按钮发出。 -->
        <button id="upload_button" class="upload_button">上传图片</button>
        <!-- 点击后向 /denoising 发 POST 请求，显示模型输入图和去噪图。 -->
        <button id="denoising_button" class="denoising_button">图像去噪</button>
        <!-- 点击后向 /classification 上传去噪结果或原图，展示类别。 -->
        <button id="classification_button" class="classification_button">商品分类</button>
        <!-- 点击后向 /simimages 上传图片并展示相似商品。 -->
        <button id="similarity_button" class="similarity_button">相似商品</button>
    </div>
    <!-- 三张对比图的网格容器；CSS 会根据屏幕宽度自动排列。 -->
    <div class="preview-container">
        <!-- 单张图片与其标题组成一张卡片；三个同名 class 复用同一套样式。 -->
        <div class="preview-card">
            <!-- 当前区域的小标题，说明下面是原图、模型输入、恢复结果还是其他功能区。 -->
            <h3>原始图片</h3>
            <!-- 原图元素初始 hidden；JS 选图后设置 src 并取消隐藏。alt 是无法显示图片时的替代文字。 -->
            <img class="preview-image" id="image-preview" hidden alt="Image Preview">
        </div>
        <!-- 单张图片与其标题组成一张卡片；三个同名 class 复用同一套样式。 -->
        <div class="preview-card">
            <!-- 当前区域的小标题，说明下面是原图、模型输入、恢复结果还是其他功能区。 -->
            <h3>噪声图片</h3>
            <!-- 模型输入图的展示位置，初始隐藏，去噪成功后由 JS 填入 Base64 图片。 -->
            <img class="noised-image" id="image-noised" hidden alt="Denoised Image">
        </div>
        <!-- 单张图片与其标题组成一张卡片；三个同名 class 复用同一套样式。 -->
        <div class="preview-card">
            <!-- 当前区域的小标题，说明下面是原图、模型输入、恢复结果还是其他功能区。 -->
            <h3>去噪结果</h3>
            <!-- 恢复结果的展示位置；图片文件由后端模型产生，不是 CSS 绘制出来的。 -->
            <img class="denoising-image" id="image-denoising" hidden alt="Denoised Image">
        </div>
    </div>
    <div>
        <!-- 当前区域的小标题，说明下面是原图、模型输入、恢复结果还是其他功能区。 -->
        <h3>分类结果</h3>
        <!-- 只读多行文本框；readonly 阻止手动修改结果，但 JS 仍可更新 value。 -->
        <textarea id="result-text" rows="1" readonly></textarea>
    </div>
    <!-- 当前区域的小标题，说明下面是原图、模型输入、恢复结果还是其他功能区。 -->
    <h3>相似商品推荐</h3>
    <!-- 初始为空；JS 根据检索结果逐项创建 img 并加入这里。 -->
    <div class="similar-images" id="similar-images"></div>
</div>

<!-- 加载 JS；defer 表示等待 HTML 解析完再执行，保证 JS 能找到前面的页面元素。 -->
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
