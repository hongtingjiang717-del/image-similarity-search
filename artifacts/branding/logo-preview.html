<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品识图助手 Logo 预览</title>
<style>
* { box-sizing: border-box; }
html,body { margin:0; background:#f1f5fb; }
body { min-height:320px; display:grid; place-items:center; font-family:"Microsoft YaHei",sans-serif; }
.brand { width:calc(100% - 64px); padding:56px 60px; background:white; border-radius:20px; display:flex; gap:28px; align-items:center; }
img { width:128px; height:128px; object-fit:contain; }
h1 { margin:0; color:#19355a; font-size:42px; letter-spacing:2px; }
p { margin:16px 0 0; color:#66758a; font-size:19px; letter-spacing:1px; }
@media(max-width:600px) { .brand { padding:32px 20px; gap:16px; width:calc(100% - 24px); } img { width:64px; height:64px; } h1 { font-size:24px; } p { font-size:12px; letter-spacing:0; } }
</style>
</head>
<body><div class="brand"><img src="../../web/logo/product-image-assistant.png" alt="图片框与放大镜"><div><h1>商品识图助手</h1><p>图片去噪 · 商品分类 · 相似图片搜索</p></div></div></body>
</html>
